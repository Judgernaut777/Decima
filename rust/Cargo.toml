[workspace]
resolver = "2"
members = ["decima-core", "decima-verify"]

[workspace.dependencies]
blake2 = "0.10.6"
ed25519-dalek = "2.2.0"
serde = "1.0.228"
serde_json = "1.0.145"
unicode-normalization = "0.1.24"
hex = "0.4.3"
rusqlite = { version = "0.32.1", features = ["bundled"] }

[profile.release]
debug = false
